name: PR checks

# Two independent jobs:
#   python-tests  -- fast, no ROS install needed, REQUIRED to merge. Runs the
#                    ROS-free unit tests (byte_tracker, depth_utils, color_classifier,
#                    label_vote, ...) plus lint. Any test that needs rclpy/cv_bridge/
#                    vision_msgs self-skips here via pytest.importorskip, it does not fail.
#   ros2-build     -- best-effort colcon build + full test suite (including the ROS-
#                    dependent tests) in an actual ROS 2 Humble environment. Runs only
#                    on push to main (NOT on pull_request) so PRs aren't gated behind
#                    a 10+ minute, still-flaky ROS environment job -- see rosdep key
#                    coverage for python3-ultralytics in particular, it may need a
#                    local rosdep rule.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    name: Lint + unit tests (ROS-free)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless pyyaml pytest ruff

      - name: Lint (ruff)
        run: |
          ruff check rtdetr_zed_tracker/rtdetr_zed_tracker fusion_pkg/fusion_pkg

      - name: rtdetr_zed_tracker test suite
        working-directory: rtdetr_zed_tracker
        run: pytest test/ -v --ignore=test/test_yolo_world_mock.py

      # fusion_pkg/test/ is intentionally not run here: as of this writing it only
      # contains ament boilerplate tests (test_copyright.py, test_flake8.py,
      # test_pep257.py) that import ament_copyright/ament_flake8/ament_pep257,
      # which only exist inside a sourced ROS 2 install -- the ros2-build job
      # below covers those via colcon test.

  ros2-build:
    name: "ROS 2 build + full test suite (best-effort, unvalidated)"
    # Only runs on push to main -- NOT on pull_request, see comment above.
    if: github.event_name == 'push'
    # Pinned to 22.04 (jammy) on purpose: ROS 2 Humble only ships apt packages
    # for jammy. `ubuntu-latest` now resolves to 24.04 (noble), which has no
    # ros-humble-desktop package at all -- that mismatch is what made this job
    # fail with "apt-get install ... exit code 100".
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Remove broken rosidl Rust generator
        # ros-humble-desktop pulls in ros-humble-rosidl-generator-rs, but on
        # these runners its "rosidl_pycommon" python dependency is missing --
        # rosidl_generate_interfaces() auto-invokes every generator it finds
        # installed, so this package (which never asked for Rust support)
        # fails to build with "ModuleNotFoundError: rosidl_pycommon". Purging
        # it means CMake never discovers it, so it's skipped entirely.
        run: sudo apt-get purge -y ros-humble-rosidl-generator-rs || true

      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: |
            rtdetr_zed_tracker
            rtdetr_zed_tracker_msgs
            fusion_pkg
          target-ros2-distro: humble
          # Without this, "vcs import" (which re-clones this repo to build the
          # ROS workspace) hits it anonymously over HTTPS -- fails with a bare
          # "exit code 1" and no further detail if the repo is private.
          import-token: ${{ secrets.GITHUB_TOKEN }}
