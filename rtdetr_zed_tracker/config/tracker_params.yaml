# Parameters for tracker_node. Applied via /** so the node name/namespace is free.
/**:
  ros__parameters:
    # --- geometry (Phase 0: Isaac decoder already emits ORIGINAL pixels) ---
    source_image_width: 1280
    source_image_height: 720
    network_width: 640
    network_height: 640
    # 'source_pixels' = boxes already in original pixels (this Isaac pipeline; verified Phase 0/2).
    # 'network_padded' = boxes in 640 padded space -> apply inverse letterbox with padding_mode.
    detection_coordinate_space: "source_pixels"
    padding_mode: "top_left"        # only used when detection_coordinate_space == network_padded

    # --- ByteTrack ---
    track_high_thresh: 0.5
    track_low_thresh: 0.1
    new_track_thresh: 0.6
    match_thresh: 0.8
    max_age: 30
    min_hits: 3
    class_gating: "soft"            # strict | soft | none
    class_mismatch_penalty: 0.3

    # --- labels / io ---
    class_labels_file: ""           # empty -> built-in 7 buoy classes
    input_qos_reliability: "reliable"   # reliable | best_effort
